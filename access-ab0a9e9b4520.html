<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>HATAKE アクセス集計（関係者専用）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f4f6f8;color:#33383d;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-feature-settings:"palt"1;-webkit-font-smoothing:antialiased}
.wrap{max-width:580px;margin:0 auto;padding:26px 16px 60px}
.head{text-align:center;border-bottom:2px solid #2f7d2b;padding-bottom:14px;margin-bottom:18px}
.brand{font-size:40px;font-weight:900;letter-spacing:4px;color:#2f7d2b;line-height:1}
.head h1{font-size:14px;font-weight:700;color:#6f7d74;margin-top:8px}
.head .lock{display:inline-block;margin-top:6px;font-size:10.5px;font-weight:800;letter-spacing:.12em;color:#8a5a2b;background:#f6efe6;border:1px solid #e6d5bf;border-radius:20px;padding:3px 11px}
.total{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.tcard{background:#2f7d2b;color:#fff;border-radius:14px;padding:16px 14px;text-align:center;box-shadow:0 3px 10px rgba(47,125,43,.22)}
.tcard.pv{background:#8a5a2b;box-shadow:0 3px 10px rgba(138,90,43,.22)}
.tcard .k{font-size:11px;font-weight:700;opacity:.9;letter-spacing:.06em}
.tcard .v{font-size:38px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
.tcard .v small{font-size:14px;font-weight:700;opacity:.85;margin-left:3px}
.sub{font-size:11px;font-weight:800;color:#8a5a2b;letter-spacing:.06em;margin:6px 2px 8px}
.card{background:#fff;border:1px solid #e4e8ec;border-left:4px solid #2f7d2b;border-radius:11px;padding:13px 15px;margin-bottom:10px;box-shadow:0 1px 3px rgba(30,40,50,.05)}
.card.c-race{border-left-color:#8a5a2b}
.card .lab{font-size:13px;font-weight:800;color:#33383d;margin-bottom:9px}
.card .lab small{font-weight:600;color:#8b9198;font-size:10px;margin-left:4px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.met{background:#fbfcfd;border:1px solid #eef1f4;border-radius:9px;padding:9px 11px}
.met .mk{font-size:10px;font-weight:700;color:#8b9198}
.met .mv{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;color:#256321;line-height:1.1;margin-top:1px}
.met .mv small{font-size:11px;font-weight:700;color:#8b9198;margin-left:2px}
.met.pv .mv{color:#8a5a2b}
.bar{display:flex;align-items:center;gap:10px;margin-top:16px;justify-content:center}
.bar button{font-size:12px;font-weight:800;color:#2f7d2b;background:#eef7ec;border:1.5px solid #2f7d2b;border-radius:20px;padding:7px 16px;cursor:pointer}
.bar button:hover{background:#2f7d2b;color:#fff}
.bar .upd{font-size:11px;color:#9aa7a0}
.note{font-size:10.5px;color:#b0b6bc;line-height:1.9;margin-top:20px;text-align:center}
.err{display:none;text-align:center;color:#c0392b;font-size:12px;margin-top:14px}
.pulse{animation:pl .8s ease}@keyframes pl{0%{opacity:.35}100%{opacity:1}}
</style></head>
<body>
<div class="wrap">
  <div class="head">
    <div class="brand">HATAKE</div>
    <h1>アクセス集計</h1>
    <div class="lock"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> 関係者専用</div>
  </div>
  <div class="total">
    <div class="tcard"><div class="k">端末数（ユニーク）合計</div><div class="v"><span id="tot-uu">…</span><small>台</small></div></div>
    <div class="tcard pv"><div class="k">開かれた回数（PV）合計</div><div class="v"><span id="tot-pv">…</span><small>回</small></div></div>
  </div>
  <div class="sub">ページ別</div>
  <div class="card c-condition">
    <div class="lab">本日のコンディション<small>condition</small></div>
    <div class="metrics">
      <div class="met"><div class="mk">端末数（ユニーク）</div><div class="mv"><span id="condition-uu">…</span><small>台</small></div></div>
      <div class="met pv"><div class="mk">開かれた回数</div><div class="mv"><span id="condition-pv">…</span><small>回</small></div></div>
    </div>
  </div>
  <div class="card c-race">
    <div class="lab">本日の傾向（レース別）<small>race</small></div>
    <div class="metrics">
      <div class="met"><div class="mk">端末数（ユニーク）</div><div class="mv"><span id="race-uu">…</span><small>台</small></div></div>
      <div class="met pv"><div class="mk">開かれた回数</div><div class="mv"><span id="race-pv">…</span><small>回</small></div></div>
    </div>
  </div>
  <div class="bar"><button id="rf" onclick="load()"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg> 更新</button><span class="upd" id="upd"></span></div>
  <div class="err" id="err">取得に失敗しました。時間をおいて再度お試しください。</div>
  <div class="note">端末数＝その端末で初めて開いた時だけ+1（実来場者の目安）。開かれた回数＝表示のたび+1（延べPV）。<br>各ページを <code>?me=1</code> で一度開くと、その端末は以後カウント対象外。カルテ（トップ）は計測していません。</div>
</div>
<script>
var NS='hatakeb7aff469c2', PAGES=['condition','race'], METS=['uu','pv'];
function get(key){return fetch('https://abacus.jasoncameron.dev/get/'+NS+'/'+key).then(function(r){return r.json();}).then(function(j){return (j&&typeof j.value==='number')?j.value:0;}).catch(function(){return null;});}
function fmt(n){return n.toLocaleString('ja-JP');}
function put(id,v){var el=document.getElementById(id);el.textContent=fmt(v);el.classList.remove('pulse');void el.offsetWidth;el.classList.add('pulse');}
function load(){
  document.getElementById('err').style.display='none';
  var keys=[];PAGES.forEach(function(p){METS.forEach(function(m){keys.push(p+'_'+m);});});
  Promise.all(keys.map(get)).then(function(vals){
    if(vals.some(function(v){return v===null;}))document.getElementById('err').style.display='block';
    var map={},tu=0,tp=0;
    keys.forEach(function(k,i){map[k]=vals[i]||0;});
    PAGES.forEach(function(p){
      put(p+'-uu',map[p+'_uu']);put(p+'-pv',map[p+'_pv']);
      tu+=map[p+'_uu'];tp+=map[p+'_pv'];
    });
    put('tot-uu',tu);put('tot-pv',tp);
    var d=new Date();document.getElementById('upd').textContent='最終更新 '+d.getHours()+':'+('0'+d.getMinutes()).slice(-2);
  });
}
load();setInterval(load,30000);
</script>
</body></html>
